packages:
  - packages/*
  - runtimes/*
allowBuilds:
  # These packages compile or download the native binaries used by tests and runtime adapters.
  better-sqlite3: true
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - '@toad-contracts/core@1.0.0'
  - '@toad-contracts/hono@1.0.0'
  - '@toad-contracts/valibot@1.0.0'
