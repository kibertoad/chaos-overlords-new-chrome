# Infrastructure dependencies for running the Node.js server against Postgres.
# SQLite mode (the default for a self-hosted server) needs nothing from here.
#
#   docker compose up -d
#   DATABASE_URL=postgres://chaos:chaos@localhost:5432/chaos pnpm dev:node
#   TEST_DATABASE_URL=postgres://chaos:chaos@localhost:5432/chaos pnpm test
services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: chaos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chaos}
      POSTGRES_DB: chaos
    ports:
      # Loopback only. Docker publishes a port by writing its own NAT rules, which bypass most host
      # firewalls (ufw included), so "0.0.0.0:5432" on a VPS puts a superuser with a known password
      # on the internet. Set POSTGRES_PASSWORD and change this line deliberately if you need more.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaos -d chaos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
