# Cloudflare deployment of the multiplayer server. Bindings only; no account ids or secrets.
# The D1 migration lineage is the storage package's SQLite one (shared with better-sqlite3), so
# `wrangler d1 migrations apply` and the Node migrator run the same files.
name = "chaos-overlords-multiplayer"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PUBLIC_LISTING = "false"
RATE_LIMIT_PER_MINUTE = "30"
MEMBER_RATE_LIMIT_PER_MINUTE = "240"
UPLOAD_RATE_LIMIT_PER_MINUTE = "10"
BUG_REPORT_RATE_LIMIT_PER_MINUTE = "5"
RETENTION_DAYS = "30"

[[d1_databases]]
binding = "DB"
database_name = "chaos_overlords"
database_id = "replace-with-your-d1-database-id"
migrations_dir = "../../packages/storage/migrations/sqlite"

# Bug reports live in a SECOND D1 instance, with its own migration lineage. They arrive
# unauthenticated, outlive the matches they describe, and carry other players' game journals, so
# they share nothing with the database holding live matches. Remove this binding and the bug report
# route answers 404; matches are unaffected either way.
#   wrangler d1 create chaos_overlords_bug_reports
#   wrangler d1 migrations apply chaos_overlords_bug_reports --remote
[[d1_databases]]
binding = "BUG_DB"
database_name = "chaos_overlords_bug_reports"
database_id = "replace-with-your-bug-report-d1-database-id"
migrations_dir = "../../packages/bug-reports/migrations/sqlite"

# The journals themselves. A compressed whole-match journal runs from hundreds of kilobytes to a few
# megabytes, D1 refuses a row over 2 MB, and even the ones that fit would be dragged through every
# triage query, so the bytes go to R2 and BUG_DB keeps the metadata and the key. Without this bucket
# only journals under BUG_REPORT_LIMITS.inlineStateBytes (256 KiB) are kept at all.
#   wrangler r2 bucket create chaos-overlords-bug-reports
[[r2_buckets]]
binding = "BUG_BLOBS"
bucket_name = "chaos-overlords-bug-reports"

[[durable_objects.bindings]]
name = "MATCH_HUB"
class_name = "MatchHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchHub"]

# Safety net for deadlines whose alarm was lost, seals interrupted mid-flight, and retention;
# the Durable Object alarm remains the precise path for a deadline.
[triggers]
crons = ["*/5 * * * *"]
