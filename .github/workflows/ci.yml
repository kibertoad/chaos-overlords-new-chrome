name: Continuous integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-latest
          - name: macOS arm64
            os: macos-15
          - name: macOS x64
            os: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify repository legal boundary
        shell: pwsh
        run: ./tools/Verify-Repository.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore Rechaos.slnx

      - name: Build without original assets
        run: dotnet build Rechaos.slnx --no-restore -p:IncludeOriginalAssets=false -v minimal

      - name: Test
        run: dotnet test --project tests/Rechaos.Tests/Rechaos.Tests.csproj --no-restore --no-progress --minimum-expected-tests 330 -v minimal

      - name: Publish assetless game
        run: dotnet publish src/Rechaos.Game/Rechaos.Game.csproj --no-restore -c Release -p:IncludeOriginalAssets=false --output artifacts/assetless-game -v minimal

      - name: Verify proprietary asset boundary
        shell: pwsh
        run: |
          $assetDirectory = Join-Path $PWD 'artifacts/assetless-game/Assets'
          if (Test-Path -LiteralPath $assetDirectory) {
            throw "Assetless publish unexpectedly contains an Assets directory: $assetDirectory"
          }

      - name: Smoke-test published entry point
        run: dotnet artifacts/assetless-game/Rechaos.Game.dll --smoke-test

  package-windows:
    name: Windows installer
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Verify repository legal boundary
        shell: pwsh
        run: ./tools/Verify-Repository.ps1

      - name: Install pinned installer compiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          gh release download is-7_1_0 `
            --repo jrsoftware/issrc `
            --pattern 'innosetup-7.1.0-x64.exe' `
            --dir $env:RUNNER_TEMP
          gh release verify-asset $installer --repo jrsoftware/issrc
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') {
            throw "Unexpected Inno Setup signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          $install = Start-Process -FilePath $installer `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/SP-', '/NORESTART', "/DIR=`"$compilerRoot`"") `
            -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) {
            throw "Inno Setup installation returned $($install.ExitCode)."
          }
          "INNO_COMPILER=$compilerRoot\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows installer
        shell: pwsh
        run: ./tools/Build-WindowsInstaller.ps1 -Compiler "$env:INNO_COMPILER"

      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'ChaosOverlordsNewChrome-installer-test'
          $setup = Start-Process -FilePath 'artifacts/ChaosOverlords-NewChrome-Setup-0.1.0.exe' `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOIMPORT=1', "/DIR=`"$testRoot`"") `
            -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "Installer returned $($setup.ExitCode)." }
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Chaos Overlords - New Chrome\Chaos Overlords - New Chrome.lnk'
          if (-not (Test-Path -LiteralPath $shortcut)) { throw "Start menu shortcut is missing: $shortcut" }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          $expectedTarget = [IO.Path]::GetFullPath((Join-Path $testRoot 'Game/Rechaos.Game.exe'))
          if ($link.TargetPath -ne $expectedTarget -or [IO.Path]::GetExtension($link.TargetPath) -ne '.exe') {
            throw "Shortcut target is invalid: '$($link.TargetPath)' (expected '$expectedTarget')."
          }
          foreach ($nativeLibrary in @('SDL2.dll', 'openal.dll')) {
            $nativePath = Join-Path (Split-Path -Parent $link.TargetPath) $nativeLibrary
            if (-not (Test-Path -LiteralPath $nativePath)) { throw "Installed native library is missing: $nativePath" }
          }
          $game = Start-Process -FilePath $link.TargetPath `
            -ArgumentList '--platform-smoke-test' -WorkingDirectory $link.WorkingDirectory `
            -Wait -PassThru -WindowStyle Hidden
          if ($game.ExitCode -ne 0) { throw "Packaged game returned $($game.ExitCode)." }
          $uninstall = Start-Process -FilePath (Join-Path $testRoot 'unins000.exe') `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') `
            -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller returned $($uninstall.ExitCode)." }
          if (Test-Path -LiteralPath $shortcut) { throw "Uninstaller left the Start menu shortcut behind." }

      - name: Upload clean-room Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ChaosOverlordsNewChrome-win-x64
          path: artifacts/ChaosOverlordsNewChrome-win-x64
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ChaosOverlords-NewChrome-Setup
          path: artifacts/ChaosOverlords-NewChrome-Setup-0.1.0.exe
          if-no-files-found: error

  package-linux:
    name: Linux installer
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Verify repository legal boundary
        shell: pwsh
        run: ./tools/Verify-Repository.ps1

      - name: Build Debian installer
        shell: pwsh
        run: ./tools/Build-LinuxInstaller.ps1

      - name: Verify installed filesystem layout
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'chaos-overlords-deb-test'
          dpkg-deb --info artifacts/ChaosOverlords-NewChrome-linux-x64-Setup-0.1.0.deb
          if ($LASTEXITCODE -ne 0) { throw 'Debian package metadata is invalid.' }
          dpkg-deb --extract artifacts/ChaosOverlords-NewChrome-linux-x64-Setup-0.1.0.deb $testRoot
          if ($LASTEXITCODE -ne 0) { throw 'Debian package extraction failed.' }
          & (Join-Path $testRoot 'opt/chaos-overlords-new-chrome/Game/Rechaos.Game') --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Installed Debian game smoke test failed.' }

      - name: Upload Linux installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ChaosOverlords-NewChrome-linux-x64-Setup
          path: artifacts/ChaosOverlords-NewChrome-linux-x64-Setup-0.1.0.deb
          if-no-files-found: error

  package-macos:
    name: macOS installer (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
            runtime: osx-arm64
          - arch: x64
            os: macos-15-intel
            runtime: osx-x64

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Verify repository legal boundary
        shell: pwsh
        run: ./tools/Verify-Repository.ps1

      - name: Build macOS installer
        shell: pwsh
        env:
          TARGET_RUNTIME: ${{ matrix.runtime }}
        run: ./tools/Build-MacInstaller.ps1 -Runtime $env:TARGET_RUNTIME

      - name: Verify package structure
        shell: pwsh
        env:
          TARGET_RUNTIME: ${{ matrix.runtime }}
        run: |
          $package = "artifacts/ChaosOverlords-NewChrome-$env:TARGET_RUNTIME-Setup-0.1.0.pkg"
          $expanded = Join-Path $env:RUNNER_TEMP "chaos-overlords-$env:TARGET_RUNTIME-pkg"
          pkgutil --expand-full $package $expanded
          if ($LASTEXITCODE -ne 0) { throw 'macOS package expansion failed.' }
          $executable = Get-ChildItem -LiteralPath $expanded -Recurse -Filter 'Rechaos.Game' |
            Select-Object -First 1
          if (-not $executable) { throw 'macOS package does not contain the game executable.' }

      - name: Upload macOS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ChaosOverlords-NewChrome-${{ matrix.runtime }}-Setup
          path: artifacts/ChaosOverlords-NewChrome-${{ matrix.runtime }}-Setup-0.1.0.pkg
          if-no-files-found: error
