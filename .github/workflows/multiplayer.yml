name: Multiplayer CI

on:
  push:
    branches: [main]
    paths: &watched
      - "multiplayer/**"
      - "src/Rechaos.Multiplayer/Generated/**"
      - "src/Rechaos.Core/**"
      - "src/Rechaos.Multiplayer/**"
      - "src/Rechaos.Resolver.Wasm/**"
      - "tools/OnlineSmoke/**"
      - "tools/ResolverDeterminism/**"
      - ".github/workflows/multiplayer.yml"
  pull_request:
    paths: *watched
  # Weekly, on main and its lockfile, so a change outside the repository (the runner image, the
  # Node 22 and .NET releases the setup steps resolve, a new advisory against a pinned production
  # dependency) that breaks the build, the audit or the online smoke is found within a week even
  # when nobody touches multiplayer code. The Postgres image is pinned by digest and cannot drift.
  # A failure opens or updates an issue; see report-schedule.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The scheduled run has its own group, so a push to main does not cancel it, nor it a push.
  group: multiplayer-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test (SQLite, Postgres, workerd)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: multiplayer
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: chaos
          POSTGRES_PASSWORD: chaos
          POSTGRES_DB: chaos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chaos -d chaos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Pinned here rather than read from a `packageManager` field: that field drives corepack,
          # which is deprecated and gone in newer Node. `devEngines.packageManager` records the same
          # version for humans and turbo, and names it exactly rather than as a range: corepack, which
          # Dependabot's updater still runs, refuses a range in that field outright.
          version: 12.5.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: multiplayer/pnpm-lock.yaml

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # The runtime surface is Hono, drizzle, better-sqlite3, pg and valibot, all pinned by the
      # lockfile. Pinning is what makes a build reproducible, not what makes it safe: a pinned
      # version with an advisory against it stays pinned until somebody looks. This is the looking.
      # Production dependencies only, and only high and critical, so a dev-only advisory does not
      # block a change to the game.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      # The resolver package ships the WebAssembly build of the game's rules (bundle/, built from
      # src/Rechaos.Resolver.Wasm), and its host tests replay a match the native build played.
      - name: Bundle the WebAssembly resolver and write a native transcript
        shell: bash
        run: |
          pnpm --filter @chaos-overlords/resolver bundle
          dotnet run --project ../tools/ResolverDeterminism/ResolverDeterminism.csproj -c Release -- "${RUNNER_TEMP}/resolver-transcript.json"

      - name: Build and typecheck
        run: pnpm exec turbo run build typecheck

      - name: Test
        run: pnpm exec turbo run test:run --env-mode=loose
        env:
          TEST_DATABASE_URL: postgres://chaos:chaos@localhost:5432/chaos
          # Turns a missing URL from a green skip into a failure; see postgres.spec.ts.
          REQUIRE_POSTGRES: "1"
          # The same for the resolver's bundle and transcript; see packages/resolver/test/harness.
          REQUIRE_RESOLVER: "1"
          RESOLVER_TRANSCRIPT: ${{ runner.temp }}/resolver-transcript.json

      # The game's C# wire types are generated from these schemas and committed, so building the
      # game never needs Node. This is what stops the two from drifting apart in the meantime — which
      # is why the generated files are among the paths that trigger this workflow, and why the
      # generator is a pinned dependency rather than something fetched when the script runs.
      - name: Check the generated C# still matches the contracts
        run: pnpm codegen:check

      - name: Run the real headless game against the Node server
        shell: bash
        run: |
          export DATABASE_URL="sqlite:${RUNNER_TEMP}/online-e2e.db"
          export BUG_REPORT_DATABASE_URL=""
          log="${RUNNER_TEMP}/online-server.log"
          pnpm --filter @chaos-overlords/node-server start:source >"$log" 2>&1 &
          server_pid=$!
          # Any failure from here on, a health wait that runs out included, ends with the server's log.
          trap 'status=$?; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then echo "Server log:"; cat "$log"; fi' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then break; fi
            kill -0 "$server_pid" 2>/dev/null || exit 1
            sleep 1
          done
          curl --fail http://127.0.0.1:8787/health
          dotnet run --project ../tools/OnlineSmoke/OnlineSmoke.csproj -- http://127.0.0.1:8787 3

      # The same match against the Worker, served by `wrangler dev` in local mode: the workspace's own
      # wrangler, so the workerd build that `pnpm dev:worker` and a deploy use, with local D1, R2 and
      # Durable Objects and no Cloudflare account. The worker unit tests run inside
      # @cloudflare/vitest-pool-workers, which pins an older wrangler and workerd of its own; this step
      # is what keeps the runtime a deployment gets under test.
      - name: Run the real headless game against the Worker in local workerd
        shell: bash
        working-directory: multiplayer/runtimes/cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          wrangler=./node_modules/.bin/wrangler
          "$wrangler" --version
          pnpm db:migrate:local
          pnpm db:migrate:bugs:local
          log="${RUNNER_TEMP}/worker-server.log"
          "$wrangler" dev --config wrangler.dev.toml --local --ip 127.0.0.1 --port 8788 >"$log" 2>&1 &
          server_pid=$!
          stop_server() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          # Any failure from here on, a health wait that runs out included, ends with the Worker's log.
          trap 'status=$?; stop_server; if [ "$status" -ne 0 ]; then echo "Worker log:"; cat "$log"; fi' EXIT
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8788/health >/dev/null; then break; fi
            kill -0 "$server_pid" 2>/dev/null || exit 1
            sleep 1
          done
          curl --fail http://127.0.0.1:8788/health
          dotnet run --project ../../../tools/OnlineSmoke/OnlineSmoke.csproj -- http://127.0.0.1:8788 3
          # Stop the Worker before reading its log, so every line workerd wrote during the match has
          # reached the file through wrangler by the time it is checked.
          stop_server
          # The Worker reaches a match's Durable Object on a best-effort path that logs a failure and
          # carries on, so the lobby half of the match can pass with a broken object behind it. The
          # object's own failures show up as a call it refused, a stream it dropped, or an exception
          # that wrangler reports as `[ERROR]` or `Uncaught` rather than through the Worker's JSON
          # logger. A clean run logs none of these.
          if grep -a -e '"level":"error"' -e 'could not reach the match hub' \
            -e 'the match hub refused a call' \
            -e 'event stream dropped by the server' -e '\[ERROR\]' -e 'Uncaught' "$log"; then
            echo "The Worker logged errors during the match."
            exit 1
          fi

      # The coordination server resolves turns with a WebAssembly build of the game's rules
      # (docs/MULTIPLAYER.md, "Resolving turns on the server"). The transcript is a whole match played
      # natively, with real orders, a takeover and a return; this holds the build, in the Node host
      # and in the Cloudflare host under workerd, to the same state hash after every step, including
      # a match picked up from a snapshot, and has the native client read each host's own snapshot.
      - name: Hold the WebAssembly resolver to the native build's hashes
        shell: bash
        run: node ../tools/ResolverDeterminism/check.mjs "${RUNNER_TEMP}/resolver-transcript.json"

  # Only for the scheduled run: nobody watches its result, so it reports on an issue. A failure
  # opens an issue with the label below, or comments on the one already open; the next green run
  # comments and closes it. The label keeps the lookup to the issue list, which has no search lag.
  # A cancelled run reports nothing, so cancelling one by hand does not open an issue.
  report-schedule:
    name: Report the scheduled run
    needs: verify
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # Opens, comments on and closes the failure issue.
    steps:
      - name: Open, update or close the failure issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.verify.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          label="scheduled-multiplayer-ci"
          open_issue=$(gh issue list --state open --label "$label" --limit 1 --json number --jq '.[0].number // empty')
          if [ "$RESULT" = "success" ]; then
            if [ -n "$open_issue" ]; then
              gh issue close "$open_issue" --comment "The scheduled run passes again at ${SHA}: ${RUN_URL}"
            fi
            exit 0
          fi
          body="The weekly multiplayer CI run on main (${SHA}) ended with \`${RESULT}\`: ${RUN_URL}"
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "$body"
          else
            # Created on first use only, so a maintainer's color or description for it is kept.
            if ! gh api "repos/${GH_REPO}/labels/${label}" --silent; then
              gh label create "$label" --color B60205 \
                --description "The scheduled multiplayer CI run on main is failing"
            fi
            hint="If no commit since the last green run touched multiplayer code, look first for a new advisory in the audit step, or a new runner image, Node or .NET release. This issue closes on the next green scheduled run."
            gh issue create --title "Scheduled multiplayer CI is failing" --label "$label" \
              --body "$(printf '%s\n\n%s' "$body" "$hint")"
          fi
