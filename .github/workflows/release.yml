name: Release installers

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the recorded version the release advances
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      installers:
        description: Installer platforms to build
        required: true
        default: windows
        type: choice
        options:
          - windows
          - no-mac-x64
          - all
      signed_release:
        description: Installer platforms to sign; macOS installers are never signed
        required: true
        default: Windows
        type: choice
        options:
          - none
          - Windows
          - Windows/Linux

permissions: {}

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to record the release version on main before anything is built.
    outputs:
      commit: ${{ steps.record.outputs.commit }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # The release is asked for by kind, so the number is settled here, out of the version.txt
      # that main carries right now. A recorded version that carries no tag never shipped — a
      # release that recorded it and then failed, or one bumped by hand because the workflow
      # cannot commit to main — so that one is published instead of a number past it.
      - name: Choose the release version
        id: version
        shell: pwsh
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          $recorded = ./tools/Get-GameVersion.ps1
          $remoteTags = git ls-remote --tags origin 'refs/tags/*'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list the existing release tags.' }
          $released = @($remoteTags |
            ForEach-Object { (($_ -split "`t")[1] -replace '^refs/tags/', '') -replace '\^\{\}$', '' } |
            Where-Object { $_ -match '^\d+\.\d+\.\d+$' } |
            Sort-Object -Unique { [version] $_ })
          $highest = $released | Select-Object -Last 1
          if ($highest -and [version] $highest -gt [version] $recorded) {
            throw ("version.txt records $recorded, but $highest is already released. " +
              'Correct version.txt on main before releasing again.')
          }
          if ($released -contains $recorded) {
            $next = ./tools/Get-NextVersion.ps1 -Bump $env:RELEASE_BUMP -CurrentVersion $recorded
            Write-Host "Releasing $next, the $env:RELEASE_BUMP release after $recorded."
          }
          else {
            $next = $recorded
            Write-Host ("version.txt records $recorded and no tag does, so that release never " +
              "finished; publishing $recorded rather than a new $env:RELEASE_BUMP version.")
          }
          "tag=$next" >> $env:GITHUB_OUTPUT
          "version=$next" >> $env:GITHUB_OUTPUT

      # The build stamps version.txt onto every assembly, so main has to carry the released
      # version before the installers are built from this commit. The checkout keeps no push
      # credentials on purpose; the contents API commits the one line instead.
      - name: Record the release version on main
        id: record
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $recorded = (Get-Content -LiteralPath 'version.txt' -Raw).Trim()
          if ($recorded -eq $env:RELEASE_VERSION) {
            $commit = git rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve the release commit.' }
            Write-Host "main already records $env:RELEASE_VERSION."
            "commit=$commit" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/contents/version.txt?ref=main" |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read version.txt from main.' }
          $content = [Convert]::ToBase64String(
            [Text.Encoding]::UTF8.GetBytes("$env:RELEASE_VERSION`n"))
          $updated = gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/version.txt" `
            -f "message=Release $env:RELEASE_VERSION" `
            -f "content=$content" `
            -f "sha=$($existing.sha)" `
            -f 'branch=main' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to record version $env:RELEASE_VERSION on main." }
          Write-Host "Recorded $env:RELEASE_VERSION on main as $($updated.commit.sha)."
          "commit=$($updated.commit.sha)" >> $env:GITHUB_OUTPUT

  test:
    name: Test release commit
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Verify legal boundary and tests
        shell: pwsh
        run: ./tools/Invoke-Validation.ps1

  build-windows:
    name: Build Windows x64 installer
    needs: [prepare, test]
    runs-on: windows-latest
    environment: ${{ inputs.signed_release != 'none' && 'release-signing' || '' }}
    permissions:
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Verify eSigner configuration
        if: ${{ inputs.signed_release != 'none' }}
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $missing = @('ES_USERNAME', 'ES_PASSWORD', 'CREDENTIAL_ID', 'ES_TOTP_SECRET') |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing.Count -ne 0) {
            throw "Missing release-signing environment secret(s): $($missing -join ', ')."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          gh release download is-7_1_0 `
            --repo jrsoftware/issrc `
            --pattern 'innosetup-7.1.0-x64.exe' `
            --dir $env:RUNNER_TEMP
          gh release verify-asset $installer --repo jrsoftware/issrc
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') {
            throw "Unexpected Inno Setup signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          $install = Start-Process -FilePath $installer `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/SP-', '/NORESTART', "/DIR=`"$compilerRoot`"") `
            -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) {
            throw "Inno Setup installation returned $($install.ExitCode)."
          }
          "INNO_COMPILER=$compilerRoot\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows package
        shell: pwsh
        run: ./tools/Publish-Windows.ps1 -SkipArchive

      - name: Install SSL.com CodeSignTool
        if: ${{ inputs.signed_release != 'none' }}
        shell: pwsh
        run: |
          # SSL.com's GitHub Action still uses Node 20 and downloads the older CodeSignTool 1.3.0.
          $toolPath = ./tools/Install-CodeSignTool.ps1 `
            -DestinationPath (Join-Path $env:RUNNER_TEMP 'CodeSignTool-1.3.2')
          "CODESIGNTOOL_PATH=$toolPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage executables for signing
        if: ${{ inputs.signed_release != 'none' }}
        shell: pwsh
        run: |
          $packageRoot = 'artifacts/ChaosOverlordsNewChrome-win-x64'
          $signingInput = 'artifacts/esigner-input'
          $executables = @(Get-ChildItem -LiteralPath $packageRoot -Recurse -File -Filter 'Rechaos*.exe')
          if ($executables.Count -eq 0) { throw "No project executables were found below '$packageRoot'." }
          $duplicates = $executables | Group-Object Name | Where-Object Count -gt 1
          if ($duplicates) {
            throw "Executable names must be unique for eSigner staging: $($duplicates.Name -join ', ')."
          }
          New-Item -ItemType Directory -Path $signingInput -Force | Out-Null
          $executables | Copy-Item -Destination $signingInput

      - name: Sign Windows executables with SSL.com eSigner
        if: ${{ inputs.signed_release != 'none' }}
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          ./tools/Invoke-ESigner.ps1 `
            -CodeSignToolPath $env:CODESIGNTOOL_PATH `
            -InputDirectory (Join-Path $PWD 'artifacts/esigner-input') `
            -OutputDirectory (Join-Path $PWD 'artifacts/esigner-output')

      - name: Install and verify signed executables
        if: ${{ inputs.signed_release != 'none' }}
        shell: pwsh
        run: |
          $packageRoot = 'artifacts/ChaosOverlordsNewChrome-win-x64'
          $expectedNames = @(Get-ChildItem -LiteralPath 'artifacts/esigner-input' -File -Filter '*.exe' |
            Select-Object -ExpandProperty Name)
          $signedExecutables = @(Get-ChildItem -LiteralPath 'artifacts/esigner-output' -File -Filter '*.exe')
          $signedNames = @($signedExecutables | Select-Object -ExpandProperty Name)
          $difference = @(Compare-Object $expectedNames $signedNames)
          if ($difference.Count -ne 0) {
            throw "eSigner output did not match the staged executables: $($difference.InputObject -join ', ')."
          }
          foreach ($signedExecutable in $signedExecutables) {
            $destinations = @(Get-ChildItem -LiteralPath $packageRoot -Recurse -File -Filter $signedExecutable.Name)
            if ($destinations.Count -ne 1) {
              throw "Expected one destination for '$($signedExecutable.Name)', found $($destinations.Count)."
            }
            Copy-Item -LiteralPath $signedExecutable.FullName -Destination $destinations[0].FullName -Force
            $signature = Get-AuthenticodeSignature -LiteralPath $destinations[0].FullName
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
              throw "Invalid or untimestamped eSigner signature on '$($destinations[0].FullName)': $($signature.Status)."
            }
          }

      - name: Build installer from signed package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./tools/Build-WindowsInstaller.ps1 -Version $env:RELEASE_VERSION -Compiler "$env:INNO_COMPILER" -SkipPackage

      - name: Sign Windows installer with SSL.com eSigner
        if: ${{ inputs.signed_release != 'none' }}
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./tools/Invoke-ESigner.ps1 `
            -CodeSignToolPath $env:CODESIGNTOOL_PATH `
            -InputFile (Join-Path $PWD "artifacts/ChaosOverlords-NewChrome-Setup-$env:RELEASE_VERSION.exe")

      - name: Verify signed installer
        if: ${{ inputs.signed_release != 'none' }}
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $installer = "artifacts/ChaosOverlords-NewChrome-Setup-$env:RELEASE_VERSION.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
            throw "Invalid or untimestamped eSigner signature on '$installer': $($signature.Status)."
          }

      - name: Smoke-test installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SIGNED_RELEASE: ${{ inputs.signed_release }}
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'ChaosOverlordsNewChrome-installer-test'
          $installer = "artifacts/ChaosOverlords-NewChrome-Setup-$env:RELEASE_VERSION.exe"
          $setup = Start-Process -FilePath $installer `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOIMPORT=1', "/DIR=`"$testRoot`"") `
            -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "Installer returned $($setup.ExitCode)." }
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Chaos Overlords - New Chrome\Chaos Overlords - New Chrome.lnk'
          if (-not (Test-Path -LiteralPath $shortcut)) { throw "Start menu shortcut is missing: $shortcut" }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          $expectedTarget = [IO.Path]::GetFullPath((Join-Path $testRoot 'Game/Rechaos.Game.exe'))
          if ($link.TargetPath -ne $expectedTarget -or [IO.Path]::GetExtension($link.TargetPath) -ne '.exe') {
            throw "Shortcut target is invalid: '$($link.TargetPath)' (expected '$expectedTarget')."
          }
          if ($env:SIGNED_RELEASE -ne 'none') {
            $installedSignature = Get-AuthenticodeSignature -LiteralPath $link.TargetPath
            if ($installedSignature.Status -ne 'Valid' -or -not $installedSignature.TimeStamperCertificate) {
              throw "Installed game executable has an invalid or missing timestamped signature: $($installedSignature.Status)."
            }
          }
          foreach ($nativeLibrary in @('SDL2.dll', 'openal.dll')) {
            $nativePath = Join-Path (Split-Path -Parent $link.TargetPath) $nativeLibrary
            if (-not (Test-Path -LiteralPath $nativePath)) { throw "Installed native library is missing: $nativePath" }
          }
          $game = Start-Process -FilePath $link.TargetPath `
            -ArgumentList '--platform-smoke-test' -WorkingDirectory $link.WorkingDirectory `
            -Wait -PassThru -WindowStyle Hidden
          if ($game.ExitCode -ne 0) { throw "Packaged game returned $($game.ExitCode)." }
          $installedVersion = (Get-Item -LiteralPath $link.TargetPath).VersionInfo.ProductVersion
          if ($installedVersion -ne $env:RELEASE_VERSION) {
            throw "Installed game is stamped '$installedVersion', not $env:RELEASE_VERSION."
          }
          $uninstall = Start-Process -FilePath (Join-Path $testRoot 'unins000.exe') `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') `
            -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller returned $($uninstall.ExitCode)." }
          if (Test-Path -LiteralPath $shortcut) { throw "Uninstaller left the Start menu shortcut behind." }

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64
          path: artifacts/ChaosOverlords-NewChrome-Setup-*.exe
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build Linux x64 installer
    needs: [prepare, test]
    if: ${{ inputs.installers != 'windows' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.signed_release == 'Windows/Linux' && 'release-signing' || '' }}
    permissions:
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Verify OpenPGP configuration
        if: ${{ inputs.signed_release == 'Windows/Linux' }}
        shell: pwsh
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
        run: |
          $missing = @('GPG_PRIVATE_KEY', 'GPG_PASSPHRASE', 'GPG_FINGERPRINT') |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing.Count -ne 0) {
            throw "Missing release-signing environment secret(s): $($missing -join ', ')."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Build installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./tools/Build-LinuxInstaller.ps1 -Version $env:RELEASE_VERSION

      # dpkg and apt ignore signatures embedded in a standalone .deb, so the Linux installer is
      # signed the way a downloaded file can actually be checked: a detached signature beside it.
      - name: Sign Linux installer with OpenPGP
        if: ${{ inputs.signed_release == 'Windows/Linux' }}
        shell: pwsh
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./tools/Invoke-GpgSigner.ps1 -InputFile (Join-Path $PWD `
            "artifacts/ChaosOverlords-NewChrome-linux-x64-Setup-$env:RELEASE_VERSION.deb")

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x64
          path: |
            artifacts/ChaosOverlords-NewChrome-linux-x64-Setup-*.deb
            artifacts/ChaosOverlords-NewChrome-linux-x64-Setup-*.deb.asc
          if-no-files-found: error
          retention-days: 1

  # macOS installers are never signed. Apple signing needs a Developer ID Application identity for
  # the bundle, a Developer ID Installer identity for the .pkg, and notarization; none of those are
  # configured, and the packaging would have to change first (see docs/RELEASING.md).
  build-macos:
    name: Build macOS ${{ matrix.arch }} installer
    needs: [prepare, test]
    if: ${{ inputs.installers != 'windows' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
            runtime: osx-arm64
          - arch: x64
            os: macos-15-intel
            runtime: osx-x64
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Build installer
        if: ${{ matrix.arch != 'x64' || inputs.installers == 'all' }}
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_RUNTIME: ${{ matrix.runtime }}
        run: ./tools/Build-MacInstaller.ps1 -Version $env:RELEASE_VERSION -Runtime $env:TARGET_RUNTIME

      - name: Upload installer
        if: ${{ matrix.arch != 'x64' || inputs.installers == 'all' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-${{ matrix.arch }}
          path: artifacts/ChaosOverlords-NewChrome-${{ matrix.runtime }}-Setup-*.pkg
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [prepare, build-windows, build-linux, build-macos]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.build-windows.result == 'success' &&
        (inputs.installers == 'windows' ||
          (needs.build-linux.result == 'success' && needs.build-macos.result == 'success'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the annotated tag and GitHub Release.
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create annotated tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve release commit.' }
          $tagObject = gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/tags" `
            -f "tag=$env:RELEASE_TAG" `
            -f "message=Release $env:RELEASE_TAG" `
            -f "object=$commit" `
            -f 'type=commit' | ConvertFrom-Json
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" `
            -f "ref=refs/tags/$env:RELEASE_TAG" `
            -f "sha=$($tagObject.sha)"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create release tag reference.' }

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_INSTALLERS: ${{ inputs.installers }}
          RELEASE_SIGNING: ${{ inputs.signed_release }}
        run: |
          mapfile -t assets < <(find release-assets -type f -print | sort)
          expected=1
          if [[ "$RELEASE_INSTALLERS" == no-mac-x64 ]]; then expected=3; fi
          if [[ "$RELEASE_INSTALLERS" == all ]]; then expected=4; fi
          if [[ "$RELEASE_SIGNING" == "Windows/Linux" && "$RELEASE_INSTALLERS" != windows ]]; then
            expected=$((expected + 1))
          fi
          if (( ${#assets[@]} != expected )); then
            echo "Expected $expected release asset(s), found ${#assets[@]}." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "Chaos Overlords: New Chrome $RELEASE_TAG"
