name: Release Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create, for example 0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^(\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?)$') {
            throw "Tag '$env:RELEASE_TAG' must look like 0.1.0."
          }
          $existing = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($existing) { throw "Tag '$env:RELEASE_TAG' already exists." }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          gh release download is-7_1_0 `
            --repo jrsoftware/issrc `
            --pattern 'innosetup-7.1.0-x64.exe' `
            --dir $env:RUNNER_TEMP
          gh release verify-asset $installer --repo jrsoftware/issrc
          $process = Start-Process -FilePath $installer `
            -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER' `
            -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation returned $($process.ExitCode)."
          }

      - name: Test
        shell: pwsh
        run: dotnet test --project tests/Rechaos.Tests/Rechaos.Tests.csproj --no-progress -v minimal

      - name: Build versioned installer
        shell: pwsh
        run: ./tools/Build-WindowsInstaller.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Create and push tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$env:RELEASE_TAG" --message "Release $env:RELEASE_TAG"
          git push origin "$env:RELEASE_TAG"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "artifacts/ChaosOverlords-NewChrome-Setup-$env:RELEASE_VERSION.exe" `
            --verify-tag `
            --generate-notes `
            --title "Chaos Overlords: New Chrome $env:RELEASE_TAG"
