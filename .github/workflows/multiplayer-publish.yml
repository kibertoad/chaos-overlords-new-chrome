name: Publish multiplayer packages

# Publishes the multiplayer workspace to npm with OIDC trusted publishing: the job trades its
# GitHub-issued id-token for a short-lived registry credential, so there is no npm token anywhere in
# this repository. Each package must name this workflow as a trusted publisher on npmjs.com first
# (Settings -> Trusted publishers: this repository, workflow `multiplayer-publish.yml`), and the
# first release of a brand-new package name has to be pushed by hand, because a package that does
# not exist yet cannot have a trusted publisher. That binding is to this file's name, which is why a
# release runs from here rather than from a second workflow.
#
# Nobody types the next version. This workflow is asked for a release kind - patch, minor or major -
# and works the number out at release time from the version the publishable package manifests on
# main record just then, the way the installer release works its number out of `version.txt`
# (`multiplayer/scripts/release-version.mjs` settles it, and says in the log how). It records that
# version in every manifest on main before anything is published, and its jobs run from that commit,
# so one run records, packs, publishes and tags the same version:
#
#   mode: release   records the version on main, runs the same checks, publishes, and only then
#                   creates the `multiplayer-vX.Y.Z` annotated tag on the commit it published.
#                   This is what the form offers by default: a dispatch that nobody reconfigured
#                   is a release, since that is what the form is opened to do.
#   mode: rehearse  runs every check and packs each tarball, then stops without touching either the
#                   registry or main, so a rehearsal never advances the recorded version. Ask for
#                   it to prove a release would pass before cutting one.
#
# Pushing a `multiplayer-v*` tag by hand still publishes, which is the escape hatch for a release cut
# from a commit other than the tip of main. The tag this workflow creates itself does not re-enter
# here: a ref created with GITHUB_TOKEN does not start another workflow run. Were that ever to
# change, the second run would fail on npm refusing to republish a version that already exists,
# rather than publishing anything twice.

on:
  push:
    tags:
      - "multiplayer-v*"
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the recorded package version the release advances
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      mode:
        description: Release records the version, publishes and tags; rehearse stops before the registry.
        required: true
        default: release
        type: choice
        options:
          - release
          - rehearse

permissions: {}

# Releases run one at a time, since two started together would settle on the same number.
concurrency:
  group: multiplayer-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    # A workflow_dispatch runs the workflow file of the branch it is dispatched from, and npm
    # trusted publishing matches on repository, workflow file name and environment rather than on
    # branch. A release comes from main or from a `multiplayer-v*` tag and from nowhere else; the
    # deployment-branch rule on the `npm` environment is the real gate, and this is the second one.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Required to record the release version in the package manifests on main.
    outputs:
      commit: ${{ steps.record.outputs.commit || steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A dispatched release is cut from the tip of main, whatever branch the Run workflow form was
      # pointed at. A tag push is cut from the commit the tag names. Both then pin a commit SHA that
      # the jobs below check out, so a push to main mid-release cannot split them across two commits.
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # A dispatched release is asked for by kind, so the number is settled out of the manifests and
      # the release tags; the version it settles on is by construction one no tag carries yet, which
      # is why nothing here re-checks that. A tag push names its version outright, and is the one way
      # in that may carry a prerelease suffix.
      - name: Resolve release version
        id: release
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="${GITHUB_REF_NAME#multiplayer-v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::'$version' is not a semantic version." >&2
              exit 1
            fi
          else
            version="$(node multiplayer/scripts/release-version.mjs "$RELEASE_BUMP")"
          fi
          {
            echo "version=$version"
            echo "tag=multiplayer-v$version"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # The tag ends up on a commit whose manifests already carry the version it names, so the
      # record lands on main before anything is published. A run that records a version and then
      # fails leaves main asking for that same version next time round, rather than a number past
      # it. A rehearsal records nothing, and a tag push has nothing to record: it may be cut from a
      # commit that is not on main at all. The checkout keeps no push credentials on purpose; the
      # git data API commits the manifests instead.
      - name: Record the release version on main
        id: record
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        # Named explicitly for `pipefail`: the API calls below run inside pipelines, where a failure
        # anywhere but the last command would otherwise pass for a recorded version.
        shell: bash
        run: |
          # The script names the manifests it rewrote, so the commit carries those and nothing else.
          changed="$(node multiplayer/scripts/set-version.mjs "$RELEASE_VERSION")"
          commit="$(git rev-parse HEAD)"
          if [[ -z "$changed" ]]; then
            echo "main already records $RELEASE_VERSION."
          else
            mapfile -t manifests <<< "$changed"
            # The contents API writes one file per call, which would put nine commits on main for
            # one release. The git data API takes every manifest as a single tree instead.
            tree="$(for file in "${manifests[@]}"; do
                jq -n --arg path "$file" --rawfile content "$file" \
                  '{path: $path, mode: "100644", type: "blob", content: $content}'
              done |
              jq -s --arg base "$(git rev-parse 'HEAD^{tree}')" '{base_tree: $base, tree: .}' |
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq '.sha')"
            commit="$(jq -n \
              --arg message "Multiplayer packages $RELEASE_VERSION" \
              --arg tree "$tree" \
              --arg parent "$commit" \
              '{message: $message, tree: $tree, parents: [$parent]}' |
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq '.sha')"
            # Deliberately not a force update: main having moved on since the checkout fails the
            # release here, rather than recording a version over somebody else's commit.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" \
              -f "sha=$commit" --silent
            echo "Recorded $RELEASE_VERSION on main as $commit."
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  # Everything that runs repository code, in a job that holds no OIDC identity and no environment.
  # `pnpm install` (install scripts allowed for better-sqlite3, esbuild and workerd), the whole
  # build, the whole vitest suite including the workerd pool, and the codegen check all run here —
  # and any of them could otherwise have asked GitHub for the job's id-token and traded it at the
  # registry for permission to publish all nine packages with valid provenance.
  verify:
    name: Verify and pack
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read # Required to check out the release commit.
    defaults:
      run:
        working-directory: multiplayer
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: chaos
          POSTGRES_PASSWORD: chaos
          POSTGRES_DB: chaos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chaos -d chaos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Pinned here rather than read from a `packageManager` field: that field drives corepack,
          # which is deprecated and gone in newer Node. `devEngines.packageManager` records the same
          # version for humans and turbo, and names it exactly rather than as a range: corepack, which
          # Dependabot's updater still runs, refuses a range in that field outright.
          version: 12.5.1

      # No dependency cache, deliberately: a cache entry poisoned by a pull request build would be
      # restored here and baked into a published tarball. A release install is worth the extra
      # minute. (zizmor's cache-poisoning audit; the pull request workflow does cache.)
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # A dispatched release already recorded this version on main, so for the commit checked out
      # above this is a no-op that says so. A release cut from a tag applies it here instead, since
      # that commit need never have carried it, and the tarballs and their rewritten `workspace:*`
      # dependencies have to agree either way.
      - name: Apply the release version to every package
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/set-version.mjs "$RELEASE_VERSION"

      - name: Check every publishable package is at the release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: pnpm check-versions "$RELEASE_VERSION"

      - name: Build and typecheck
        run: pnpm exec turbo run build typecheck

      - name: Test
        run: pnpm exec turbo run test:run --env-mode=loose
        env:
          TEST_DATABASE_URL: postgres://chaos:chaos@localhost:5432/chaos
          # Turns a missing URL from a green skip into a failure; see postgres.spec.ts.
          REQUIRE_POSTGRES: "1"

      - name: Check the generated C# still matches the contracts
        run: pnpm codegen:check

      # Packs every package and prints the file list without contacting the registry, so a tarball
      # that is missing its dist or its licence fails here rather than after it is published. This
      # is also what runs each package's `prepublishOnly` file check.
      - name: Rehearse the publish
        run: pnpm publish -r --dry-run --no-git-checks --access public

      - name: Pack the release tarballs
        run: pnpm pack-release "$RUNNER_TEMP/release-tarballs"

      - name: Upload the release tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: multiplayer-tarballs
          path: ${{ runner.temp }}/release-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1

  # The only job with an OIDC identity, and it runs no repository code at all: it downloads the
  # tarballs the job above produced and hands each one to `pnpm publish`. Publishing a tarball runs
  # no lifecycle scripts from the package, so what reaches the registry is exactly the bytes that
  # were rehearsed and tested.
  publish:
    name: Publish to npm
    needs: [prepare, verify]
    if: github.event_name == 'push' || inputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing and provenance attestations.
    steps:
      # The same pnpm the rehearsal and the pack ran on, and it is the whole toolchain this job
      # needs: pnpm 12 ships a native executable and performs the OIDC exchange itself, so no Node
      # is set up here and no `.npmrc` is written. The version is pinned rather than ranged because
      # the exchange is young: pnpm 11 took the registry protocol over from the npm CLI and broke it
      # for a few releases, and a job that only ever runs at release time is the wrong place to find
      # that out. It is the version the verify job packed with.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1

      - name: Download the release tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: multiplayer-tarballs
          path: tarballs

      - name: Publish to npm
        run: |
          shopt -s nullglob
          tarballs=(tarballs/*.tgz)
          if (( ${#tarballs[@]} == 0 )); then
            echo 'No tarballs to publish.' >&2
            exit 1
          fi
          {
            echo '## Published'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for tarball in "${tarballs[@]}"; do
            # Kept as an explicit `./` path: pnpm reads a bare `tarballs/name.tgz` as a path too, but
            # npm, which published these before, read it as the GitHub shorthand `owner/repo` — the
            # 0.9.4 release died on `git ls-remote ssh://git@github.com/tarballs/...tgz.git` before
            # it published a byte.
            pnpm publish "./$tarball" --provenance --access public --no-git-checks
            echo "- \`$(basename "$tarball")\`" >> "$GITHUB_STEP_SUMMARY"
          done

  tag:
    name: Tag the release
    needs: [prepare, publish]
    # Only a dispatched release has a tag left to create, and it waits for the registry to have the
    # packages: of the two, the tag is the half that is cheap to redo by hand if this step fails.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Required to create the annotated tag.
    steps:
      - name: Create the annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f "tag=$RELEASE_TAG" \
            -f "message=Multiplayer packages $RELEASE_VERSION" \
            -f "object=$RELEASE_COMMIT" \
            -f 'type=commit' --jq '.sha')"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$tag_sha"
          echo "Tagged \`$RELEASE_COMMIT\` as \`$RELEASE_TAG\`." >> "$GITHUB_STEP_SUMMARY"
