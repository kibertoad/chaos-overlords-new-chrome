name: Publish multiplayer packages

# Publishes the multiplayer workspace to npm with OIDC trusted publishing: the job trades its
# GitHub-issued id-token for a short-lived registry credential, so there is no npm token anywhere in
# this repository. Each package must name this workflow as a trusted publisher on npmjs.com first
# (Settings -> Trusted publishers: this repository, workflow `multiplayer-publish.yml`), and the
# first release of a brand-new package name has to be pushed by hand, because a package that does
# not exist yet cannot have a trusted publisher.
#
# Releasing is two steps, deliberately: bump every publishable package in a pull request
# (`pnpm -r exec npm version <version> --no-git-tag-version`, then `pnpm check-versions <version>`),
# and once it is on main push the matching tag.
#
#   git tag multiplayer-v0.2.0 && git push origin multiplayer-v0.2.0
#
# `workflow_dispatch` runs everything except the publish itself, which is the way to rehearse a
# release — including the packed file lists — without touching the registry.

on:
  push:
    tags:
      - "multiplayer-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to rehearse the release of, for example 0.2.0
        required: true
        type: string

permissions: {}

concurrency:
  group: multiplayer-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm
    permissions:
      contents: read # Required to check out the tagged commit.
      id-token: write # Required for npm trusted publishing and provenance attestations.
    defaults:
      run:
        working-directory: multiplayer
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: chaos
          POSTGRES_PASSWORD: chaos
          POSTGRES_DB: chaos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chaos -d chaos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version
        id: release
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#multiplayer-v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a semantic version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: multiplayer/package.json

      # No dependency cache, deliberately: a cache entry poisoned by a pull request build would be
      # restored here and baked into a published tarball. A release install is worth the extra
      # minute. (zizmor's cache-poisoning audit; the pull request workflow does cache.)
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # The tag is the only statement of intent about what version this is. Everything downstream —
      # the `workspace:*` ranges pnpm rewrites into each tarball — is derived from the manifests, so
      # they have to agree with it before anything is built.
      - name: Check every publishable package is at the release version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: pnpm check-versions "$RELEASE_VERSION"

      - name: Lint
        run: pnpm lint

      - name: Build and typecheck
        run: pnpm exec turbo run build typecheck

      - name: Test
        run: pnpm exec turbo run test:run --env-mode=loose
        env:
          TEST_DATABASE_URL: postgres://chaos:chaos@localhost:5432/chaos

      - name: Check the generated C# still matches the contracts
        run: pnpm codegen:check

      # Packs every package and prints the file list without contacting the registry, so a tarball
      # that is missing its dist or its licence fails here rather than after it is published.
      - name: Rehearse the publish
        run: pnpm publish -r --dry-run --no-git-checks --access public

      - name: Publish to npm
        if: github.event_name == 'push'
        run: pnpm publish -r --no-git-checks --access public --report-summary

      - name: Summarise what was published
        if: github.event_name == 'push'
        run: |
          {
            echo '## Published'
            echo
            node -e '
              const summary = require("./pnpm-publish-summary.json");
              for (const { name, version } of summary.publishedPackages) {
                console.log(`- \`${name}@${version}\``);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"
