# Nothing proposed updates for the SHA-pinned actions, the pinned Postgres image, the NuGet
# packages or the npm workspace, so every one of them moved only when somebody happened to touch it.
# Weekly, grouped, so a release is not preceded by nine separate bumps.
#
# `cooldown` holds every proposal back for a week after the version is published, which is the
# window a compromised release is usually pulled in; zizmor's `dependabot-cooldown` audit fails the
# configuration without it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /multiplayer
    schedule:
      interval: weekly
    groups:
      multiplayer:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # `docker-compose`, not `docker`: the only image this repository pins outside the workflows is the
  # Postgres service in `multiplayer/docker-compose.yml`, and there is no Dockerfile anywhere. The
  # `docker` ecosystem reads Dockerfiles and Kubernetes manifests only, so it failed every run with
  # "No Dockerfiles nor Kubernetes YAML found in /multiplayer" and the image was never offered.
  - package-ecosystem: docker-compose
    directory: /multiplayer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
