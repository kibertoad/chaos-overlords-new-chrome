# Installs the pinned Kaitai Struct compiler and points `KSC` at it, so the documentation checker
# (`tools/check-documentation.mjs`) compiles every `.ksy` definition in spec/formats/. AGENTS.md
# promises that in CI the definitions always compile, and the checker fails when CI is set and no
# compiler is found, so every workflow that runs `tools/Invoke-Validation.ps1` uses this action
# first and passes its `ksc` output to that step as `KSC`. The path is an output rather than a
# GITHUB_ENV write, which would hand every later step of the job whatever the step wrote there.
#
# No maintained action installs the compiler, so the pinned release is fetched and checked against
# its SHA-256 here. The release runs on the runner's preinstalled Java.
# kibertoad/refurbished-dinosaurs-toolkit#1 moves this into a shared action.
name: Install the Kaitai Struct compiler
description: Downloads the pinned Kaitai Struct compiler release, verifies it, and outputs its path as ksc.

outputs:
  ksc:
    description: Path of the installed compiler, for the `KSC` environment variable.
    value: ${{ steps.install.outputs.ksc }}

runs:
  using: composite
  steps:
    - name: Install the Kaitai Struct compiler
      id: install
      shell: bash
      env:
        KSC_VERSION: "0.11"
        KSC_SHA256: ff89389d9dc9e770d78a24af328763cb1f8e7b31ce7766c9edf10669a060f2a2
      run: |
        set -euo pipefail
        tmp="$RUNNER_TEMP"
        if [ "$RUNNER_OS" = Windows ]; then tmp="$(cygpath -u "$tmp")"; fi
        zip="$tmp/kaitai-struct-compiler.zip"
        curl -fsSL --retry 3 -o "$zip" \
          "https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/$KSC_VERSION/kaitai-struct-compiler-$KSC_VERSION.zip"
        # shasum first: the Linux, macOS and Windows (Git Bash) runners all have it, and macOS 15
        # runners also have a BSD sha256sum that accepts fewer options than GNU's. GNU sha256sum is
        # the fallback for an image without Perl. The line is written here, so --strict would add
        # nothing: both tools exit nonzero on a mismatch or when no line is well formed. The `*`
        # marker makes both read the zip in binary mode.
        if command -v shasum >/dev/null; then sum=(shasum -a 256); else sum=(sha256sum); fi
        echo "$KSC_SHA256 *$zip" | "${sum[@]}" --check
        unzip -q -o "$zip" -d "$tmp"
        bin="$tmp/kaitai-struct-compiler-$KSC_VERSION/bin/kaitai-struct-compiler"
        if [ "$RUNNER_OS" = Windows ]; then bin="$bin.bat"; fi
        "$bin" --version
        if [ "$RUNNER_OS" = Windows ]; then bin="$(cygpath -w "$bin")"; fi
        echo "ksc=$bin" >> "$GITHUB_OUTPUT"
