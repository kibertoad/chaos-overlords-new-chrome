# Sets up pnpm and Node.js and installs the documentation standard's checker, which the root
# package.json pins and `tools/check-documentation.mjs` (run by `tools/Invoke-Validation.ps1`)
# runs. Every workflow that runs the gate uses this action, so the pnpm and Node.js versions and
# the install flags change in one place.
name: Install the documentation checker
description: Sets up pnpm and Node.js and installs the root package.json's documentation checker.

inputs:
  cache:
    description: >-
      'true' restores and saves the pnpm store between runs. The release jobs pass 'false', since a
      poisoned cache entry would be restored into the checker that gates the release (zizmor's
      cache-poisoning audit).
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 12.5.1

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        cache-dependency-path: ${{ inputs.cache == 'true' && 'pnpm-lock.yaml' || '' }}
        package-manager-cache: ${{ inputs.cache == 'true' }}

    - name: Install the documentation checker
      shell: bash
      run: pnpm install --frozen-lockfile
